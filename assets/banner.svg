<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Cynrath — Software Engineering &amp; Developer Tooling</title>
  <desc id="desc">Dark editorial banner with subtle animated signal moving through a planning, building, and verification diagram. All information remains visible without animation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111D2D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56B8F7"/>
      <stop offset="100%" stop-color="#55E0C1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity=".10"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#surface)"/>
    <rect x="616" y="0" width="384" height="300" fill="url(#dots)"/>
    <path d="M0 0H1000" stroke="url(#rule)" stroke-width="5"/>
    <path d="M615 42V258" stroke="#A5B4C7" stroke-opacity=".14"/>
    <path d="M34 270H966" stroke="#A5B4C7" stroke-opacity=".14"/>
    <path d="M34 30h20M34 30v20M966 30h-20M966 30v20M34 270h20M34 270v-20M966 270h-20M966 270v-20"
          fill="none" stroke="#A5B4C7" stroke-opacity=".23" stroke-width="1.2"/>

    <circle cx="67" cy="64" r="4" fill="#56E0BF">
      <animate attributeName="opacity" values="1;.5;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600"
          letter-spacing="2.7" fill="#92A6BD">BUILDING RELIABLE SYSTEMS</text>

    <text x="60" y="158" font-family="Arial, Helvetica, sans-serif" font-size="76"
          font-weight="700" letter-spacing="-3.7" fill="#F2F6FB">Cynrath</text>
    <rect x="61" y="175" width="92" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="61" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20"
          font-weight="400" fill="#BBCADA">Software engineering · Developer tooling</text>
    <text x="61" y="247" font-family="Arial, Helvetica, sans-serif" font-size="11"
          letter-spacing="2.2" fill="#7F99B1">WEB PLATFORMS  /  AUTOMATION  /  INFRASTRUCTURE</text>

    <text x="650" y="69" font-family="Arial, Helvetica, sans-serif" font-size="11"
          font-weight="600" letter-spacing="2.3" fill="#92A6BD">ENGINEERING WORKFLOW</text>
    <text x="650" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14"
          fill="#D9E7F4">From intent to evidence.</text>

    <path d="M679 153H919" fill="none" stroke="#3B5369" stroke-width="2.5"/>
    <path d="M679 153H919" fill="none" stroke="url(#rule)" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="48 192" opacity=".55">
      <animate attributeName="stroke-dashoffset" values="240;0" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle cx="679" cy="153" r="7" fill="#111D2D" stroke="#56B8F7" stroke-width="2"/>
    <circle cx="799" cy="153" r="7" fill="#111D2D" stroke="#56B8F7" stroke-width="2"/>
    <circle cx="919" cy="153" r="7" fill="#111D2D" stroke="#55E0C1" stroke-width="2"/>
    <circle cx="679" cy="153" r="2.5" fill="#8FD4FF"/>
    <circle cx="799" cy="153" r="2.5" fill="#8FD4FF"/>
    <circle cx="919" cy="153" r="2.5" fill="#93F4D9"/>
    <circle cx="679" cy="153" r="3.5" fill="#B7F8E9">
      <animate attributeName="cx" values="679;919" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.07;.93;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="679" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"
          font-weight="600" letter-spacing="1.3" fill="#C4D7E6">PLAN</text>
    <text x="799" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"
          font-weight="600" letter-spacing="1.3" fill="#C4D7E6">BUILD</text>
    <text x="919" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"
          font-weight="600" letter-spacing="1.3" fill="#C4D7E6">VERIFY</text>

    <rect x="649" y="210" width="315" height="37" rx="7" fill="#1B2A3D" stroke="#4B6076" stroke-opacity=".35"/>
    <text x="665" y="233" font-family="Arial, Helvetica, sans-serif" font-size="11.5"
          fill="#9EB7CA">Context  /  delivery  /  confidence</text>
    <text x="937" y="233" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="10" fill="#55E0C1">●</text>
  </g>
</svg>