<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
<title id="title">Cynrath — software engineer and developer tooling</title>
<desc id="description">Editorial dark banner featuring the Cynrath wordmark and a luminous precision-engineering monogram. Only the orbit signal and a fine line animate; text is always visible.</desc>
